<form>
    <div class="form-group">
        <label>Transaction ID</label>
        <input
          disabled
          type="text"
          [(ngModel)]="formData.id"
          name="id"
          required
        />
      </div>

    <div class="form-group">
      <label>Type</label>
      <select [(ngModel)]="formData.type" name="type" disabled required>
        <option [value]="TransactionType.Income">Income</option>
        <option [value]="TransactionType.Expense">Expense</option>
      </select>
    </div>
  
    <div class="form-group">
      <label>Amount</label>
      <input
        disabled
        type="number"
        [(ngModel)]="formData.amount"
        name="amount"
        required
        min="0"
        step="0.01"
      />
    </div>
  
    <div class="form-group">
      <label>Currency</label>
      <select [(ngModel)]="formData.currency" name="currency" disabled required>
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
        <option value="PLN">PLN</option>
      </select>
    </div>
  
    <div class="form-group">
      <label>Category</label>
      <input
        disabled
        list="categories"
        [(ngModel)]="formData.category"
        name="category"
        required
      />
      <datalist id="categories">
        <option *ngFor="let cat of categories" [value]="cat"></option>
      </datalist>
    </div>
  
    <div class="form-group">
      <label>Description</label>
      <input
        disabled
        type="text"
        [(ngModel)]="formData.description"
        name="description"
      />
    </div>
  
    <div class="form-group">
      <label>Date</label>
      <input
        disabled
        type="date"
        [ngModel]="transactionDateAsString"
        (ngModelChange)="setDateFromString($event)"
        name="date"
        required
        />
    </div>
</form>
